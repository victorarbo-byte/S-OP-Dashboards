<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manufacturing KPI Dashboard — May 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f3; --surface: #fff;
    --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.16);
    --t1: #1a1a18; --t2: #6b6a65; --t3: #9e9d97;
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--t1); min-height: 100vh; padding: 32px 24px 64px; }
  .wrap { max-width: 1120px; margin: 0 auto; }

  /* ── Header ── */
  .hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .hdr h1 { font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
  .hdr p  { font-size: 13px; color: var(--t2); margin-top: 3px; }
  .tag { font-size: 11px; font-weight: 500; background: var(--t1); color: #fff; padding: 4px 12px; border-radius: 20px; align-self: center; }

  /* ── Dropdown plant selector ── */
  .plant-selector { position: relative; margin-bottom: 28px; display: inline-block; }
  .ps-trigger {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-radius: var(--r-md);
    border: 1px solid var(--border-strong); background: var(--surface);
    cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 500;
    color: var(--t1); user-select: none; min-width: 200px;
  }
  .ps-trigger:hover { border-color: var(--t1); }
  .ps-trigger .arrow { margin-left: auto; font-size: 10px; color: var(--t3); transition: transform .2s; }
  .ps-trigger.open .arrow { transform: rotate(180deg); }
  .ps-dot-trigger { display: none; }
  .ps-dropdown {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--r-lg); padding: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    z-index: 100; min-width: 200px;
  }
  .ps-dropdown.open { display: block; }
  .ps-option {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--r-sm);
    cursor: pointer; font-size: 13px; font-weight: 500; color: var(--t2);
    transition: background .1s;
  }
  .ps-option:hover { background: var(--bg); color: var(--t1); }
  .ps-option.selected { color: var(--t1); }
  .ps-option.selected::after { content: '✓'; margin-left: auto; font-size: 12px; color: var(--t3); }
  .ps-dot { display: none; }

  /* ── KPI summary cards ── */
  .kpi-groups { display: flex; gap: 12px; margin-bottom: 0; align-items: stretch; }
  .kpi-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .kpi-group-label { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding-left: 2px; }
  .kpi-group-cards { display: flex; gap: 8px; flex: 1; padding: 10px; border-radius: var(--r-lg); border: 1px solid var(--border); border-top: 3px solid; }
  .kpi-card { flex: 1; min-width: 0; background: var(--surface); border-radius: var(--r-md); padding: 10px 10px 8px; }
  .kc-label { font-size: 10px; font-weight: 600; color: var(--t3); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 6px; line-height: 1.3; min-height: 24px; }
  .kc-val   { font-size: 20px; font-weight: 700; letter-spacing: -.4px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kc-vs    { display: flex; align-items: center; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .kc-py    { font-size: 11px; color: var(--t3); }
  .kc-delta { font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 20px; }
  .d-ok  { background: #eaf3de; color: #3b6d11; }
  .d-bad { background: #fcebeb; color: #a32d2d; }
  .d-eq  { background: #f0efea; color: #6b6a65; }

  /* ── Sticky top bar ── */
  .sticky-top {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg);
    padding-top: 32px;
    margin-top: -32px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .section { margin-bottom: 36px; }
  .sec-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .sec-lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--t3); white-space: nowrap; }
  .sec-line { flex: 1; height: 1px; background: var(--border); }

  /* ── Family selector ── */
  .family-selector { position: relative; flex-shrink: 0; }
  .fs-trigger {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: var(--r-md);
    border: 1px solid var(--border-strong); background: var(--surface);
    cursor: pointer; font-family: var(--font); font-size: 12px; font-weight: 500;
    color: var(--t2); user-select: none; white-space: nowrap;
  }
  .fs-trigger:hover { border-color: var(--t1); color: var(--t1); }
  .fs-trigger.open .fs-arrow { transform: rotate(180deg); }
  .fs-arrow { font-size: 10px; color: var(--t3); transition: transform .2s; }
  .fs-dropdown {
    display: none; position: absolute; top: calc(100% + 4px); right: 0;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--r-lg); padding: 5px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    z-index: 100; min-width: 150px;
  }
  .fs-dropdown.open { display: block; }
  .fs-option {
    padding: 8px 12px; border-radius: var(--r-sm);
    cursor: pointer; font-size: 12px; font-weight: 500; color: var(--t2);
    transition: background .1s;
  }
  .fs-option:hover { background: var(--bg); color: var(--t1); }
  .fs-option.selected { color: var(--t1); font-weight: 600; }
  .fs-option.selected::after { content: ' ✓'; color: var(--t3); }

  /* ── KPI selector ── */
  .kpi-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .kpi-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: var(--r-md);
    border: 1px solid var(--border-strong); background: var(--surface);
    cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 500;
    color: var(--t2); transition: all .14s; outline: none;
  }
  .kpi-btn:hover { border-color: var(--t1); color: var(--t1); }
  .kpi-btn.active { background: var(--t1); border-color: var(--t1); color: #fff; }
  .kpi-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── Chart card ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; }
  .card-ttl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--t3); margin-bottom: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 12px; }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--t2); }
  .leg-sw   { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .chart-h300 { position: relative; width: 100%; height: 300px; }
</style>
</head>

// Map KPI key to FAMILY_DATA sheet
function familySheet(kpi) {
  if (kpi === 'tons') return 'Volume';
  if (kpi === 'oee')  return 'OEE';
  if (kpi === 'util') return 'util';
  return null;
}

// Get available families for current plant + kpi
function availableFamilies(plant, kpi) {
  const sheet = familySheet(kpi);
  if (!sheet || !FAMILY_DATA[sheet]) return [];
  const plantKey = plant === 'all' ? null : plant;
  if (!plantKey) {
    // Union of all families across all plants
    const all = new Set();
    Object.values(FAMILY_DATA[sheet]).forEach(p => Object.keys(p).forEach(f => all.add(f)));
    return [...all];
  }
  return Object.keys(FAMILY_DATA[sheet][plantKey] || {});
}

// ── Normalization ──
// For integer KPIs: historical full-year values are normalized to 5-month equivalent
function normalize(v, kpi, isYTD) {
  if (v == null) return null;
  if (isYTD) return v; // YTD is already 5 months
  if (META[kpi].isInt) return v / 12 * MONTHS; // scale full year → 5 months
  return v; // % KPIs: use as-is (already rates/averages)
}

// ── Formatting ──
function fmt(v, kpi) {
  if (v == null) return '—';
  if (META[kpi].pct) return (v*100).toFixed(1)+'%';
  if (kpi==='tons') return v>=1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(1);
  if (kpi==='complaints') return v.toFixed(2);
  if (kpi==='co2') return v.toFixed(3);
  if (META[kpi].isInt) return v < 10 ? v.toFixed(1) : Math.round(v).toString();
  return v.toFixed(1);
}
function fmtAxis(v, kpi) {
  if (META[kpi].pct) return (v*100).toFixed(1)+'%';
  if (kpi==='tons') return v>=1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(1);
  if (kpi==='complaints') return v.toFixed(2);
  if (kpi==='co2') return v.toFixed(3);
  if (Math.abs(v) < 5) return v.toFixed(1);
  return Math.round(v).toString();
}

// ── KPI summary cards ──
const CARD_GROUPS = [
  { label: 'People & Quality',    color: '#E24B4A', kpis: ['accidents','complaints'] },
  { label: 'Factory Performance', color: '#378ADD', kpis: ['tons','util','oee'] },
  { label: 'Environment',         color: '#3B6D11', kpis: ['waste','co2'] },
];

// 'abs' = show prior year raw value | 'pp' = percentage points | 'pct' = % change
function comparativeType(kpi) {
  if (kpi === 'accidents' || kpi === 'complaints') return 'abs';
  if (META[kpi].pct) return 'pp';
  return 'pct';
}
function fmtComparative(ytd, py, kpi) {
  const m = META[kpi];
  const type = comparativeType(kpi);
  if (ytd == null || py == null) return { text: '—', cls: 'd-eq' };

  // Color always based on % change vs py, threshold ±10%
  // For pct KPIs stored as 0..1, pctChange = ((ytd-py)/|py|)*100
  const pctChange = py !== 0 ? ((ytd - py) / Math.abs(py)) * 100 : null;
  let cls = 'd-eq';
  if (pctChange !== null) {
    const better = m.hib ? pctChange > 0 : pctChange < 0;
    cls = Math.abs(pctChange) <= 10 ? 'd-eq' : (better ? 'd-ok' : 'd-bad');
  }

  if (type === 'abs') {
    if (py === 0 && ytd === 0) return { text: "vs '25: 0", cls: 'd-eq' };
    const diff = ytd - py;
    const sign = diff > 0 ? '+' : diff < 0 ? '-' : '';
    let absCls = cls;
    if (pctChange === null) {
      const m2 = META[kpi];
      const better = m2.hib ? diff > 0 : diff < 0;
      absCls = diff === 0 ? 'd-eq' : (better ? 'd-ok' : 'd-bad');
    }
    return { text: "vs '25: " + sign + fmt(Math.abs(diff), kpi), cls: absCls };
  }
  if (type === 'pp') {
    const diff = (ytd - py) * 100;
    const sign = diff > 0 ? '+' : '';
    return { text: sign + diff.toFixed(1) + 'pp', cls };
  }
  // pct
  if (py === 0) return { text: '—', cls: 'd-eq' };
  const sign = pctChange > 0 ? '+' : '';
  return { text: sign + Math.round(pctChange) + '%', cls };
}

function renderCards() {
  const vp = visPlantsArr();

  function cardHtml(kpi) {
    const m = META[kpi];
    const ytdVals = vp.map(p => normalize(RAW[kpi][p]?.ytd, kpi, true)).filter(v => v != null);
    const pyVals  = vp.map(p => normalize(RAW[kpi][p]?.[2025], kpi, false)).filter(v => v != null);
    const ytd = ytdVals.length ? (m.ua ? ytdVals.reduce((a,b)=>a+b,0)/ytdVals.length : ytdVals.reduce((a,b)=>a+b,0)) : null;
    const py  = pyVals.length  ? (m.ua ? pyVals.reduce((a,b)=>a+b,0)/pyVals.length   : pyVals.reduce((a,b)=>a+b,0))  : null;

    const comp = (ytd != null && py != null) ? fmtComparative(ytd, py, kpi) : { text: '—', cls: 'd-eq' };
    const deltaHtml = `<span class="kc-delta ${comp.cls}">${comp.text}</span>`;

    const unitLabel = m.pct ? '' : ` <span style="font-weight:400;text-transform:none;letter-spacing:0">(${m.unit})</span>`;
    return `<div class="kpi-card">
      <div class="kc-label">${m.shortLabel}${unitLabel}</div>
      <div class="kc-val">${fmt(ytd,kpi)}</div>
      <div class="kc-vs">
        ${deltaHtml}
      </div>
    </div>`;
  }

  document.getElementById('kpi-groups').innerHTML = CARD_GROUPS.map(g => `
    <div class="kpi-group">
      <div class="kpi-group-label" style="color:${g.color}">${g.label}</div>
      <div class="kpi-group-cards" style="border-top-color:${g.color};background:${g.color}08">
        ${g.kpis.map(cardHtml).join('')}
      </div>
    </div>`).join('');
}

      borderRadius: 3,

  document.getElementById(`${sec}-ttl`).textContent =
    `${m.label} — year over year · ${selectedPlant === 'all' ? 'all plants' : selectedPlant}${normNote}`;
  document.getElementById(`${sec}-leg`).innerHTML =
    vi.map(i => `<span class="leg-item"><span class="leg-sw" style="background:${COLORS[i]}"></span>${PLANTS[i]}</span>`).join('');

  const ctx = document.getElementById(`${sec}-bar`).getContext('2d');
  if (charts[sec]) charts[sec].destroy();
  charts[sec] = new Chart(ctx, {
    type: 'bar',
    data: { labels: yearsWithData.map(yr => yr === '2026 YTD' ? '2026 YTD' : String(yr)), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y, kpi)}${m.pct?'': ' '+m.unit}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#9e9d97', maxRotation: 0 } },
        y: {
          grid: { color: 'rgba(0,0,0,0.05)' },
          ticks: { font: { size: 11 }, color: '#9e9d97', callback: v => fmtAxis(v, kpi) },
          title: { display: true, text: m.pct ? '%' : m.unit, color: '#9e9d97', font: { size: 11 } }
        }
      }
    }
  });
}

// Family-level chart for Factory Performance when a specific plant is selected
function renderFamilyChart(kpi) {
  const m     = META[kpi];
  const plant = selectedPlant;
  const pi    = PLANTS.indexOf(plant);
  const color = COLORS[pi];

  // "Total" → use plant-level RAW data (same as the all-plants view but single plant)
  if (selectedFamily === 'total') {
    const normNote = m.isInt ? ' (prior years scaled to 5 months)' : '';
    document.getElementById('fp-ttl').textContent =
      `${m.label} — ${plant} · Total${normNote}`;
    document.getElementById('fp-leg').innerHTML =
      `<span class="leg-item"><span class="leg-sw" style="background:${color}"></span>${plant}</span>`;

    const yearsWithData = YEARS.filter(yr => {
      const k = yr === '2026 YTD' ? 'ytd' : yr;
      return RAW[kpi][plant][k] != null;
    });

    const datasets = [{
      label: plant,
      data: yearsWithData.map(yr => {
        const isYTD = yr === '2026 YTD';
        const k = isYTD ? 'ytd' : yr;
        return normalize(RAW[kpi][plant][k], kpi, isYTD);
      }),
      backgroundColor: yearsWithData.map(yr => color + (yr === '2026 YTD' ? 'ff' : '88')),
      borderColor:     yearsWithData.map(yr => yr === '2026 YTD' ? color : 'transparent'),
      borderWidth: 1.5, borderRadius: 3, skipNull: true,
    }];

    const ctx = document.getElementById('fp-bar').getContext('2d');
    if (charts.fp) charts.fp.destroy();
    charts.fp = new Chart(ctx, {
      type: 'bar',
      data: { labels: yearsWithData.map(yr => yr === '2026 YTD' ? '2026 YTD' : String(yr)), datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y, kpi)}${m.pct?'':' '+m.unit}` } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#9e9d97', maxRotation: 0 } },
          y: { grid: { color: 'rgba(0,0,0,0.05)' },
            ticks: { font: { size: 11 }, color: '#9e9d97', callback: v => fmtAxis(v, kpi) },
            title: { display: true, text: m.pct ? '%' : m.unit, color: '#9e9d97', font: { size: 11 } }
          }
        }
      }
    });
    return;
  }

  const sheet = familySheet(kpi);
  const plantFamilyData = FAMILY_DATA[sheet][plant] || {};

  // Filter to selected family or show all families
  const families = (selectedFamily === 'all' || selectedFamily === 'total')
    ? Object.keys(plantFamilyData)
    : Object.keys(plantFamilyData).filter(f => f === selectedFamily);

  // Family colors — use a palette cycling through
  const FAM_COLORS = ['#378ADD','#1D9E75','#D85A30','#534AB7','#BA7517','#D4537E','#E24B4A','#3B6D11'];

  // Years with data across selected families
  const allYears = [2021,2022,2023,2024,2025,'2026 YTD'];
  const yearsWithData = allYears.filter(yr => {
    const k = yr === '2026 YTD' ? 'ytd' : yr;
    return families.some(f => plantFamilyData[f]?.[k] != null);
  });

  const isVolume = kpi === 'tons';

  const datasets = families.map((fam, fi) => ({
    label: fam,
    data: yearsWithData.map(yr => {
      const isYTD = yr === '2026 YTD';
      const k = isYTD ? 'ytd' : yr;
      const v = plantFamilyData[fam]?.[k];
      if (v == null) return null;
      // Volume: normalize prior years ÷12×5
      if (isVolume && !isYTD) return v / 12 * 5;
      return v;
    }),
    backgroundColor: yearsWithData.map(yr => FAM_COLORS[fi % FAM_COLORS.length] + (yr === '2026 YTD' ? 'ff' : '88')),
    borderColor:     yearsWithData.map(yr => yr === '2026 YTD' ? FAM_COLORS[fi % FAM_COLORS.length] : 'transparent'),
    borderWidth: 1.5,
    borderRadius: 3,
    skipNull: true,
  }));

  const famLabel = selectedFamily === 'all' ? 'all families' : selectedFamily;
  const normNote = isVolume ? ' (prior years scaled to 5 months)' : '';
  document.getElementById('fp-ttl').textContent =
    `${m.label} — ${plant} · ${famLabel}${normNote}`;
  document.getElementById('fp-leg').innerHTML =
    families.map((f, fi) => `<span class="leg-item"><span class="leg-sw" style="background:${FAM_COLORS[fi % FAM_COLORS.length]}"></span>${f}</span>`).join('');

  const ctx = document.getElementById('fp-bar').getContext('2d');
  if (charts.fp) charts.fp.destroy();
  charts.fp = new Chart(ctx, {
    type: 'bar',
    data: { labels: yearsWithData.map(yr => yr === '2026 YTD' ? '2026 YTD' : String(yr)), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y, kpi)}${m.pct?'':' '+m.unit}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#9e9d97', maxRotation: 0 } },
        y: {
          grid: { color: 'rgba(0,0,0,0.05)' },
          ticks: { font: { size: 11 }, color: '#9e9d97', callback: v => fmtAxis(v, kpi) },
          title: { display: true, text: m.pct ? '%' : m.unit, color: '#9e9d97', font: { size: 11 } }
        }
      }
    }
  });
}

function renderAll() {
  renderCards();
  renderChart('pq', activeKPI.pq);
  buildFamilyDropdown();
  renderChart('fp', activeKPI.fp);
  renderChart('env', activeKPI.env);
}

function selKPI(sec, kpi) {
  activeKPI[sec] = kpi;
  document.querySelectorAll(`[data-s="${sec}"]`).forEach(b => b.classList.toggle('active', b.dataset.k === kpi));
  if (sec === 'fp') {
    const fams = availableFamilies(selectedPlant, kpi);
    const hasFamilies = selectedPlant !== 'all' && fams.length > 0;
    if (hasFamilies) {
      // Keep selection if valid (total always valid), else reset to total
      if (selectedFamily !== 'total' && !fams.includes(selectedFamily)) {
        selectedFamily = 'total';
        document.getElementById('fs-label').textContent = 'Total';
      }
    } else {
      selectedFamily = 'all';
    }
    buildFamilyDropdown();
  }
  renderChart(sec, kpi);
}

// ── Init ──
buildDropdown();
updateTrigger();
buildFamilyDropdown();
renderAll();
</script>
</body>
</html>
