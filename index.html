<!DOCTYPE html>
<html>
<head>
  <title>Operations Hub</title>

  <style>
    body {
      font-family: Arial;
      background:#f5f6fa;
      margin:0;
      padding:20px;
    }

    h1 {
      text-align:center;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
      gap:20px;
      margin-top:30px;
    }

    .card {
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.2s;
    }

    .card:hover {
      transform:scale(1.05);
    }

    a {
      text-decoration:none;
      color:black;
    }

    .title {
      font-size:20px;
      font-weight:bold;
    }

    .desc {
      color:gray;
      margin-top:10px;
    }
  </style>
</head>

<body>

<h1>GBFoods Operations Hub</h1>

<div class="grid">

apps/demand/index.html
  <div class="card">
    <div class="title">Demand</div>
    <div class="desc">Forecast & planning tools</div>
  </div>
</a>

apps/supply/index.html
  <div class="card">
    <div class="title">Supply</div>
    <div class="desc">Capacity & stock</div>
  </div>
</a>

apps/sop/index.html
  <div class="card">
    <div class="title">S&OP</div>
    <div class="desc">Executive dashboards</div>
  </div>
</a>

</div>

</body>
</html>
