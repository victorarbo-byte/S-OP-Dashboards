<!DOCTYPE html>
<html>
<head>
  <title>Operations Dashboards</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f5f6fa;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card:hover {
      transform: scale(1.03);
    }

    a {
      text-decoration: none;
      color: black;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 13px;
      color: gray;
    }
  </style>
</head>

<body>

<h1>Operations Dashboard Hub</h1>

<div class="grid">

  apps/demand/index.html
    <div class="card">
      <div class="title">Demand</div>
      <div class="desc">Forecast and planning</div>
    </div>
  </a>

  apps/supply/index.html
    <div class="card">
      <div class="title">Supply</div>
      <div class="desc">Capacity and stock</div>
    </div>
  </a>

  apps/sop/index.html
    <div class="card">
      <div class="title">S&OP</div>
      <div class="desc">Executive dashboards</div>
    </div>
  </a>

</div>


</body>
</html>
