<!DOCTYPE html>
<html>
<head>
  <title>Operations Dashboards</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    a {
      text-decoration: none;
      color: black;
    }

    .title {
      font-size: 18px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .desc {
      font-size: 13px;
      color: gray;
    }
  </style>
</head>

<body>

<h1>Operations Dashboard Hub</h1>

<div class="grid">

  <a href="apps/supply/index.html">
    <div class="card">
      <div class="title">Supply Dashboard</div>
      <div class="desc">Capacity, stock and production planning</div>
    </div>
  </a>

  <a href="apps/sales/index.html">
    <div class="card">
      <div class="title">Sales Dashboard</div>
      <div class="desc">Demand, forecast and performance</div>
    </div>
  </a>

  <a href="apps/master-data/index.html">
    <div class="card">
      <div class="title">Master Data Tracker</div>
      <div class="desc">SAP data quality & governance</div>
    </div>
  </a>

</div>

</body>
</html>
